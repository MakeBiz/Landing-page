<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | MakeBiz Group</title>
<meta name="description" content="Такой страницы на сайте MakeBiz нет. Перейдите на главную или выберите нужный раздел.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090D">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090D;--tx:#EAF1FF;--mu:#93A4B8;--g:#16C15A;--g2:#0C7A33;--r:#C8102E;--r2:#E4384D;--ln:rgba(255,255,255,.10);--gl:rgba(255,255,255,.05)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:Oxygen,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.mesh{position:fixed;inset:0;z-index:-1;background:radial-gradient(720px 500px at 10% -6%,rgba(200,16,46,.14),transparent 60%),radial-gradient(780px 580px at 92% 4%,rgba(22,193,90,.14),transparent 62%),radial-gradient(700px 620px at 60% 108%,rgba(22,193,90,.10),transparent 60%),linear-gradient(180deg,#07090D,#0A0E12)}
a{color:var(--g);text-decoration:none}
.box{width:100%;max-width:720px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:34px}
.logo img{width:34px;height:34px;border-radius:9px}
.logo b{font-size:17px;letter-spacing:.02em}
.code{font-size:clamp(76px,17vw,148px);font-weight:700;line-height:.9;letter-spacing:-.03em;background:linear-gradient(180deg,#FFFFFF,#4E5C70);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin-top:18px;font-size:clamp(23px,4.2vw,33px);font-weight:700;letter-spacing:-.01em}
p.sub{margin-top:14px;color:var(--mu);font-size:16px}
.btns{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid transparent;transition:.18s}
.btn.p{background:linear-gradient(120deg,var(--r),var(--r2));color:#fff;box-shadow:0 10px 30px rgba(200,16,46,.28)}
.btn.p:hover{transform:translateY(-2px)}
.btn.s{background:var(--gl);border-color:var(--ln);color:var(--tx)}
.btn.s:hover{border-color:rgba(255,255,255,.24)}
.sect{margin-top:44px;padding-top:26px;border-top:1px solid var(--ln)}
.sect .lb{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.links{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.links a{display:inline-flex;padding:9px 16px;border-radius:100px;border:1px solid var(--ln);background:rgba(255,255,255,.03);color:var(--tx);font-size:14px;transition:.18s}
.links a:hover{border-color:var(--g);color:var(--g)}
.foot{margin-top:34px;color:var(--mu);font-size:13px}
.foot a{color:var(--mu);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="mesh"></div>

<div class="box">
  <a class="logo" href="/" data-home>
    <img src="/favicon.png" alt="MakeBiz Group" width="34" height="34">
    <b>MakeBiz Group</b>
  </a>

  <div class="code">404</div>
  <h1 data-t="title">Такой страницы нет</h1>
  <p class="sub" data-t="sub">Возможно, адрес набран с опечаткой или страницу перенесли. Ниже основные разделы сайта.</p>

  <div class="btns">
    <a class="btn p" href="/" data-home data-t="home">На главную</a>
    <a class="btn s" href="/contacts" data-nav="/contacts" data-t="contacts">Связаться с нами</a>
  </div>

  <div class="sect">
    <div class="lb" data-t="lb">Разделы</div>
    <div class="links">
      <a href="/ai-agents"         data-nav="/ai-agents"  data-t="p1">AI-агенты</a>
      <a href="/bitrix"            data-nav="/bitrix"     data-t="p2">Битрикс24</a>
      <a href="/vector"            data-nav="/vector"     data-t="p3">Vector, аналитика звонков</a>
            <a href="/vps"               data-nav="/vps"        data-t="p5">Серверы и VPS</a>
      <a href="/keysy"             data-nav="/keysy"      data-t="p6">Кейсы</a>
      <a href="/partners"          data-nav="/partners"   data-t="p7">Партнёрам</a>
      <a href="/news"              data-nav="/news"       data-t="p8">Новости</a>
    </div>
  </div>

  <p class="foot" data-t="foot">Нужна помощь? Напишите в <a href="https://t.me/Anton_MakeBiz" rel="noopener">Telegram</a>.</p>
</div>

<script>
/* Страница отдаётся одна на весь сайт, поэтому язык и ссылки подстраиваем
   под адрес, по которому человек попал: /en остаётся в английской версии,
   /ru в своей копии. */
(function () {
  var p = location.pathname;
  var pre = /^\/en(\/|$)/.test(p) ? '/en' : (/^\/ru(\/|$)/.test(p) ? '/ru' : '');

  if (pre) {
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      a.setAttribute('href', pre + a.getAttribute('data-nav'));
    });
    document.querySelectorAll('[data-home]').forEach(function (a) {
      a.setAttribute('href', pre === '/en' ? '/en' : '/ru');
    });
  }

  if (pre !== '/en') return;

  document.documentElement.lang = 'en';
  document.title = 'Page not found | MakeBiz Group';
  var EN = {
    title: 'This page does not exist',
    sub: 'The address may contain a typo, or the page has moved. Here are the main sections of the site.',
    home: 'Go to home',
    contacts: 'Contact us',
    lb: 'Sections',
    p1: 'AI agents', p2: 'Bitrix24', p3: 'Vector, call analytics',
    p4: 'IntDoc, AI for procurement', p5: 'Servers and VPS',
    p6: 'Case studies', p7: 'Partners', p8: 'News'
  };
  Object.keys(EN).forEach(function (k) {
    document.querySelectorAll('[data-t="' + k + '"]').forEach(function (el) { el.textContent = EN[k]; });
  });
  var f = document.querySelector('[data-t="foot"]');
  if (f) f.innerHTML = 'Need help? Message us on <a href="https://t.me/Anton_MakeBiz" rel="noopener">Telegram</a>.';
})();
</script>
<!-- MakeBiz: кнопка наверх -->
<script>
(function(){
  if(window.__mbTopDone) return; window.__mbTopDone=1;

  var EN = /^\/en(\/|$)/.test(location.pathname);
  var LBL = EN ? 'Back to top' : 'Наверх';
  var SHOW = 420;

  /* Фон страниц рисует отдельный слой, поэтому он прозрачный и по нему тему
     не определить. Надёжнее смотреть на цвет текста: тёмный текст значит
     светлую страницу, как в русской версии. */
  function isLight(){
    try{
      var c = getComputedStyle(document.body || document.documentElement).color || '';
      var m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c);
      if(!m) return false;
      return (m[1]*0.299 + m[2]*0.587 + m[3]*0.114) < 140;
    }catch(e){ return false; }
  }

  function style(){
    if(document.getElementById('mbTopCSS')) return;
    var s = document.createElement('style'); s.id = 'mbTopCSS';
    s.textContent =
      '#mbTop{position:fixed;right:14px;bottom:14px;z-index:2147481500;width:46px;height:46px;'
      + 'border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;'
      + 'padding:0;background:#0e1620;color:#eaf1fb;border:1px solid rgba(255,255,255,.18);'
      + 'box-shadow:0 8px 24px rgba(0,0,0,.38);opacity:0;visibility:hidden;transform:translateY(10px);'
      + 'transition:opacity .2s ease,transform .2s ease,visibility .2s ease}'
      + '#mbTop.on{opacity:1;visibility:visible;transform:translateY(0)}'
      + '#mbTop:hover{border-color:#16C15A;color:#16C15A}'
      + '#mbTop:focus-visible{outline:2px solid #16C15A;outline-offset:3px}'
      + '#mbTop.lt{background:#FFFFFF;color:#0B235F;border-color:rgba(11,35,95,.16);box-shadow:0 8px 24px rgba(11,35,95,.16)}'
      + '#mbTop.lt:hover{border-color:#0C7A33;color:#0C7A33}'
      + '@media(max-width:520px){#mbTop{width:42px;height:42px;right:12px}}'
      + '@media(prefers-reduced-motion:reduce){#mbTop{transition:none}}';
    (document.head || document.documentElement).appendChild(s);
  }

  var btn = null;

  function make(){
    if(document.getElementById('mbTop')) return document.getElementById('mbTop');
    var b = document.createElement('button');
    b.id = 'mbTop'; b.type = 'button'; b.title = LBL; b.setAttribute('aria-label', LBL);
    b.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';
    b.onclick = function(){
      try{ window.scrollTo({ top:0, left:0, behavior:'smooth' }); }
      catch(e){ window.scrollTo(0,0); }
      var h = document.querySelector('header, #mbm-header, .nav');
      if(h && h.focus){ setTimeout(function(){ try{ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }catch(e){} }, 620); }
    };
    (document.body || document.documentElement).appendChild(b);
    return b;
  }

  function place(){
    if(!btn) return;
    var ck = document.getElementById('mbCk');
    var off = 14;
    if(ck && ck.offsetHeight) off = ck.offsetHeight + 24;
    btn.style.bottom = off + 'px';
  }

  function tick(){
    if(!btn) return;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if(y > SHOW) btn.classList.add('on'); else btn.classList.remove('on');
    place();
  }

  function boot(){
    if(!document.body) return;
    style();
    btn = make();
    if(isLight()) btn.classList.add('lt'); else btn.classList.remove('lt');
    tick();
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  window.addEventListener('scroll', tick, { passive:true });
  window.addEventListener('resize', tick);
  setInterval(function(){ if(!document.getElementById('mbTop')) boot(); else tick(); }, 900);
})();
</script>
<!-- /MakeBiz: кнопка наверх -->
</body>
</html>
