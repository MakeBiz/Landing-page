<style>
:root{--bg:#F3F5FA;--card:#fff;--ink:#0E1B3D;--mut:#55617F;--line:#E3E8F2;--acc:#2450D8;--accd:#1A3CA8;--tint:#E4EAFB;--ok:#0F5C36;--okbg:#DDF3E8;--warn:#8A4B00;--warnbg:#FFF0DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.01em}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;gap:10px}
.rb{width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid #DDE3F0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rb.dark{background:var(--ink);color:#fff;border:none;font-weight:700;font-size:14px}
.pill{height:44px;padding:0 14px;border-radius:22px;background:#fff;border:1px solid #DDE3F0;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1px solid #DDE3F0;font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.seg{display:flex;background:#E6EAF4;border-radius:14px;padding:3px}
.seg button{flex:1;height:40px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.t-mut{color:var(--mut);font-size:13px}
.eb{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.btn{height:46px;border-radius:14px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 18px;transition:transform .08s}
.btn:active,.chip:active,.rb:active{transform:scale(.97)}
.btn.p{background:var(--acc);color:#fff}.btn.s{background:var(--tint);color:var(--accd)}.btn.o{background:#fff;border:1px solid #DDE3F0}.btn.ok{background:var(--okbg);color:var(--ok)}.btn.d{background:var(--ink);color:#fff}
.tag{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.req{background:var(--warnbg);color:var(--warn)}.tag.off{background:var(--okbg);color:var(--ok)}.tag.an{background:var(--tint);color:var(--accd)}.tag.cs{background:#EFE6FB;color:#4B2A8A}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:800}
.hero{background:var(--acc);color:#fff;border-radius:24px;padding:18px}
.datebox{width:56px;height:64px;border-radius:14px;background:var(--tint);color:var(--accd);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto}
.datebox b{font-size:20px;line-height:1}.datebox span{font-size:11px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border-radius:18px;padding:8px}
.week button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px}
.week button.on{background:var(--acc);color:#fff}
.week i{width:5px;height:5px;border-radius:3px;display:block}
.inp{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:#fff;border:1px solid #DDE3F0;border-radius:16px}
.inp input{flex:1;border:none;outline:none;background:transparent;font:500 15px Manrope,sans-serif;color:var(--ink);min-width:0}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #E9EDF5}.li:last-child{border-bottom:none}
.foot{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.back{position:sticky;top:0;z-index:5;padding:12px 0 8px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(var(--bg) 70%,transparent)}
#toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;line-height:1.4;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50;text-align:center}
#toast.on{opacity:1;transform:none}
#sheet{position:absolute;inset:0;background:rgba(14,27,61,.45);display:none;align-items:flex-end;z-index:40}
#sheet.on{display:flex}
#sheet>div{background:#fff;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-height:86%;overflow-y:auto}
.demo{font-size:11px;font-weight:800;letter-spacing:.08em;background:var(--warnbg);color:var(--warn);padding:4px 8px;border-radius:8px}
.qr{width:220px;height:220px;margin:8px auto;display:grid;grid-template-columns:repeat(21,1fr);gap:0;border:10px solid #fff;outline:1px solid var(--line);border-radius:12px}
.qr i{display:block;aspect-ratio:1}
.bar{height:6px;border-radius:3px;background:#2B3A63}.bar i{display:block;height:6px;border-radius:3px;background:#7FA0FF}
.stat{background:#fff;border-radius:16px;padding:12px}.stat b{font-size:17px;display:block}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:30px 20px;line-height:1.5}
</style>
</head>
